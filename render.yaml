services:

  # FASTAPI BACKEND
  - type: web
    name: youtube-watch-party-api
    runtime: python
    plan: free
    region: singapore

    rootDir: backend

    buildCommand: pip install -r requirements.txt

    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT

    healthCheckPath: /docs

    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: youtube-watch-party-db
          property: connectionString

      - key: JWT_SECRET_KEY
        sync: false

      - key: PYTHON_VERSION
        value: "3.12"

      - key: FRONTEND_URL
        sync: false

  - type: web
    name: youtube-watch-party
    runtime: static

    buildCommand: npm install && npm run build

    staticPublishPath: frontend/dist

    rootDir: frontend

    envVars:
      - key: VITE_API_URL
        sync: false

      - key: VITE_WS_URL
        sync: false

    routes:
      - type: rewrite
        source: /*
        destination: /index.html
databases:

  - name: youtube-watch-party-db
    plan: free
    region: singapore

